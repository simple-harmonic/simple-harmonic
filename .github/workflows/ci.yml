# CI — the standing guard for the floor plan (docs/floor-plan.md, item 3).
#
# Required-vs-advisory is controlled in GitHub branch protection, NOT here, so
# the signal stays honest (a red advisory job shows real work to do). Suggested
# rollout:
#   DAY ONE required : test, typecheck (a2ax|backend|frontend all green today)
#   ADVISORY         : lint (~55 biome errors), e2e (needs a test DB)
#   FLIP TO REQUIRED : lint once `npm run check` is green; e2e once a test DB
#                      + secrets are wired and ENABLE_E2E is set.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (biome) — advisory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [a2ax, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @simple-harmonic/${{ matrix.package }}

  test:
    name: test (vitest x3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: e2e (playwright) — advisory
    # Opt-in: set repo variable ENABLE_E2E=true once a test database + the
    # DATABASE_URL / ANTHROPIC_API_KEY secrets are configured. Skipped (grey,
    # not red) until then.
    if: ${{ vars.ENABLE_E2E == 'true' }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: CI=true npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
