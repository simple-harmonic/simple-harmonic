[project]
name = "simple-harmonic-backend"
version = "0.1.0"
description = "Python port of the Simple Harmonic backend (FastAPI). Migration slice 1."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "anthropic>=0.42",
    "openai>=1.59",
    "websockets>=14.1",
    "anyio>=4.7",
    "cryptography>=44",
]

# PEP 735 dependency group; `uv sync` installs the `dev` group by default.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simple_harmonic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["simple_harmonic", "tests"]

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I import sorting, UP pyupgrade, B bugbear, SIM, RUF.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Pydantic models commonly use camelCase fields to match the TS wire shape.
    "N815",
]

[tool.ruff.lint.isort]
known-first-party = ["simple_harmonic"]
